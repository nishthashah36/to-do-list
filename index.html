<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Floral Todo"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Floral Todo</title></head><body>
<div class="flowers">✿ · ❀　 ✧　✿　 · ❀　 ✿</div><main class="app"><header><div><h1>My little list</h1><p id="today"></p></div><div class="progress" id="progress"></div></header><nav><button class="tab active" data-view="today">Today</button><button class="tab" data-view="all">All tasks</button><button class="tab" data-view="completed">Completed</button></nav><section id="task-list"></section></main><button class="add-button" id="add-button">＋ Add task</button>
<div class="modal" id="task-modal"><div class="modal-card"><form id="task-form"><h2 id="form-heading">New task</h2><input type="hidden" id="task-id"><label for="task-title">Task</label><input id="task-title" maxlength="120" placeholder="What needs doing?" required><div class="form-grid"><div><label for="task-priority">Priority</label><select id="task-priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div><div><label for="task-category">Category</label><input id="task-category" maxlength="40" placeholder="School, Personal…"></div></div><label for="task-date">Due date (optional)</label><input id="task-date" type="date"><div class="form-actions"><button type="button" class="delete" id="delete-button">Delete</button><button type="button" class="cancel" id="cancel-button">Cancel</button><button type="submit" class="save">Save</button></div></form></div></div><script src="app.js"></script></body></html>
